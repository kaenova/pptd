[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptd-utils"
version = "0.1.0"
description = "Offline PPTD v2 toolkit for converting editable presentations to PowerPoint"
readme = "pptd_utils/README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "binaryify"}]
keywords = ["pptd", "pptx", "powerpoint", "presentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "Pillow>=9",
  "PyYAML>=6",
  "lxml>=4.9",
  "python-pptx>=0.6.21",
]

[project.optional-dependencies]
fonts = ["fontTools>=4", "brotli>=1"]
math = ["latex2mathml>=3", "mathml2omml>=0.0.2"]

[project.scripts]
pptd = "pptd_utils.main:main"
pptd-utils = "pptd_utils.main:main"

[tool.hatch.build.targets.wheel]
packages = ["pptd_utils"]
