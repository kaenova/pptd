name: Publish PyPI package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set dated release version
        id: release
        run: python scripts/set_release_version.py
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set verified release version
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/set_release_version.py
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
      - name: Tag published commit
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
